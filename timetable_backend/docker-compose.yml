services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: timetable_db
    networks:
      - database
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d timetable_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/timetable_db?schema=public
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - TICKET_QR_SECRET=${TICKET_QR_SECRET:?Set TICKET_QR_SECRET in .env}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - XENDIT_SECRET_KEY=${XENDIT_SECRET_KEY:-}
      - XENDIT_WEBHOOK_TOKEN=${XENDIT_WEBHOOK_TOKEN:-}
      - XENDIT_API_URL=${XENDIT_API_URL:-https://api.xendit.co}
      - XENDIT_SUCCESS_RETURN_URL=${XENDIT_SUCCESS_RETURN_URL:-}
      - XENDIT_CANCEL_RETURN_URL=${XENDIT_CANCEL_RETURN_URL:-}
      - KAI_REALTIME_API_URL=${KAI_REALTIME_API_URL:-}
      - KAI_REALTIME_API_TOKEN=${KAI_REALTIME_API_TOKEN:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash-lite}
      - GEMINI_VISION_MODEL=${GEMINI_VISION_MODEL:-gemini-3.5-flash-lite}
    ports:
      - "${HOST_BIND_IP:-0.0.0.0}:${HOST_PORT:-3000}:3000"
    networks:
      - frontend
      - database
    depends_on:
      setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 3

  setup:
    build:
      context: .
      target: builder
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/timetable_db?schema=public
    command: node scripts/bootstrap.mjs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - database

networks:
  frontend:
  database:
    internal: true

volumes:
  pgdata:
