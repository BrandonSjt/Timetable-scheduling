version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: timetable_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: timetable_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: timetable_backend
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/timetable_db?schema=public
      - JWT_SECRET=${JWT_SECRET}
      - TICKET_QR_SECRET=${TICKET_QR_SECRET}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - XENDIT_SECRET_KEY=${XENDIT_SECRET_KEY:-}
      - XENDIT_WEBHOOK_TOKEN=${XENDIT_WEBHOOK_TOKEN:-}
      - XENDIT_SUCCESS_RETURN_URL=${XENDIT_SUCCESS_RETURN_URL:-}
      - XENDIT_CANCEL_RETURN_URL=${XENDIT_CANCEL_RETURN_URL:-}
      - KAI_REALTIME_API_URL=${KAI_REALTIME_API_URL:-}
      - KAI_REALTIME_API_TOKEN=${KAI_REALTIME_API_TOKEN:-}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
